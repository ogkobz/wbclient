[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wbclient"
version = "0.1.0"
description = "Клиент Wildberries Seller API: карта доменов, разбор токена, лимиты и понятные ошибки"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Сергей Кобзев" }]
keywords = ["wildberries", "wb", "seller", "api", "marketplace"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Office/Business",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Source = "https://github.com/"

[tool.setuptools.packages.find]
include = ["wbclient*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
